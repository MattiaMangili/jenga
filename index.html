<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phrases">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phrases</title>
<style>
  :root {
    --bg: #111418;
    --card: #1e232a;
    --border: #3a424d;
    --text: #f2f4f7;
    --muted: #8a94a3;
    --accent: #b00020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Impact, sans-serif; letter-spacing: 0.02em;
  }
  button { font-family: inherit; }

  /* ---------- Home ---------- */
  #home {
    max-width: 480px; margin: 0 auto;
    height: 100%; display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    gap: 20px;
  }
  #modes { display: flex; gap: 10px; }
  .mode {
    flex: 1; padding: 18px 0; font-size: 1.3rem; font-weight: 600;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 14px;
  }
  .mode.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #center {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 18px;
  }
  #num {
    font-family: inherit;
    width: 100%; max-width: 220px; padding: 28px 10px;
    font-size: 2.4rem; text-align: center;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 18px; outline: none;
  }
  #num:focus { border-color: var(--accent); }
  #go {
    width: 100%; max-width: 220px; padding: 18px 0;
    font-size: 1.4rem; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 14px;
  }
  #err { min-height: 1.2em; color: #ff7a7a; font-size: 1rem; text-align: center; }
  #editBtn {
    align-self: center; padding: 10px 18px; font-size: 1rem;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px;
  }

  /* ---------- Full-screen phrase ---------- */
  #overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: none; align-items: center; justify-content: center;
    padding: 80px 24px 24px; z-index: 10;
  }
  #overlay.show { display: flex; }
  #phrase {
    font-size: clamp(2rem, 9vw, 4.5rem); font-weight: 700;
    text-align: center; line-height: 1.2; word-break: break-word;
  }
  #close {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    width: 52px; height: 52px; font-size: 1.8rem; line-height: 1;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 50%;
  }
  #tag {
    position: absolute; top: calc(26px + env(safe-area-inset-top)); left: 20px;
    font-size: 1rem; opacity: .6;
  }

  /* ---------- Edit screen ---------- */
  #editor {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    display: none; flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    gap: 12px;
  }
  #editor.show { display: flex; }
  #editor h2 { margin: 0; font-size: 1.2rem; }
  #editHelp { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.35; }
  #editTabs { display: flex; gap: 10px; }
  .etab {
    flex: 1; padding: 12px 0; font-size: 1.1rem; font-weight: 600;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
  }
  .etab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #lines {
    flex: 1; width: 100%; padding: 14px; font-size: 1.05rem; line-height: 1.5;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 14px; outline: none; resize: none;
  }
  #lines:focus { border-color: var(--accent); }
  #count { color: var(--muted); font-size: .95rem; }
  #editBar { display: flex; gap: 10px; }
  #saveBtn {
    flex: 2; padding: 16px 0; font-size: 1.2rem; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
  }
  #cancelBtn {
    flex: 1; padding: 16px 0; font-size: 1.1rem;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
  }
</style>
</head>
<body>

<div id="home">
  <div id="modes"></div>
  <div id="center">
    <input id="num" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
    <button id="go">Go</button>
    <div id="err"></div>
  </div>
  <button id="editBtn">Edit phrases</button>
</div>

<div id="overlay">
  <div id="tag"></div>
  <button id="close" aria-label="Close">✕</button>
  <div id="phrase"></div>
</div>

<div id="editor">
  <h2>Edit phrases</h2>
  <p id="editHelp">One phrase per line. Line 1 = number 1, line 2 = number 2, and so on. Leave a line empty to skip a number.</p>
  <div id="editTabs"></div>
  <textarea id="lines" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  <div id="count"></div>
  <div id="editBar">
    <button id="cancelBtn">Cancel</button>
    <button id="saveBtn">Save</button>
  </div>
</div>

<script>
/* Mode names. Change these if you like (keep the list short enough to fit on one row). */
const MODE_NAMES = ["Mild", "Spicy", "Inferno"];
const MAX = 54;
const KEY = "phrases-v1";

/* ---------- storage (only on this device) ---------- */
let data = MODE_NAMES.map(() => []);
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        data = MODE_NAMES.map((_, i) => Array.isArray(parsed[i]) ? parsed[i] : []);
      }
    }
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}
load();

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const modesEl = $("modes"), numEl = $("num"), errEl = $("err");
const overlay = $("overlay"), phraseEl = $("phrase"), tagEl = $("tag");
const editor = $("editor"), editTabs = $("editTabs"), linesEl = $("lines"), countEl = $("count");

let current = 0;

/* ---------- home ---------- */
MODE_NAMES.forEach((name, i) => {
  const b = document.createElement("button");
  b.className = "mode" + (i === 0 ? " active" : "");
  b.textContent = name;
  b.onclick = () => {
    current = i;
    [...modesEl.children].forEach((c, j) => c.classList.toggle("active", j === i));
    errEl.textContent = "";
  };
  modesEl.appendChild(b);
});

function go() {
  const n = parseInt(numEl.value, 10);
  if (!n || n < 1 || n > MAX) {
    errEl.textContent = "Enter a number from 1 to " + MAX;
    return;
  }
  const list = data[current];
  if (!list.length) {
    errEl.textContent = "No phrases in " + MODE_NAMES[current] + " yet. Tap Edit phrases.";
    return;
  }
  const text = (list[n - 1] || "").trim();
  if (!text) {
    errEl.textContent = "Nothing saved for " + n + " in " + MODE_NAMES[current];
    return;
  }
  errEl.textContent = "";
  numEl.blur();
  tagEl.textContent = MODE_NAMES[current] + " · " + n;
  phraseEl.textContent = text;
  overlay.classList.add("show");
}
function closeOverlay() {
  overlay.classList.remove("show");
  numEl.value = "";
}
$("go").onclick = go;
$("close").onclick = closeOverlay;
numEl.addEventListener("input", () => { numEl.value = numEl.value.replace(/\D/g, ""); });
numEl.addEventListener("keydown", e => { if (e.key === "Enter") go(); });

/* ---------- editor ---------- */
let draft = [];      // working copy: one string (all lines) per mode
let editing = 0;

function updateCount() {
  const lines = linesEl.value.replace(/\s+$/, "").split(/\r?\n/);
  const n = linesEl.value.trim() ? lines.length : 0;
  countEl.textContent = n + " line" + (n === 1 ? "" : "s") +
    (n > MAX ? " (only the first " + MAX + " are used)" : "");
}
function showTab(i) {
  draft[editing] = linesEl.value;
  editing = i;
  linesEl.value = draft[i];
  [...editTabs.children].forEach((c, j) => c.classList.toggle("active", j === i));
  updateCount();
}
MODE_NAMES.forEach((name, i) => {
  const b = document.createElement("button");
  b.className = "etab";
  b.textContent = name;
  b.onclick = () => showTab(i);
  editTabs.appendChild(b);
});
linesEl.addEventListener("input", updateCount);

$("editBtn").onclick = () => {
  draft = data.map(list => list.join("\n"));
  editing = current;
  linesEl.value = draft[editing];
  [...editTabs.children].forEach((c, j) => c.classList.toggle("active", j === editing));
  updateCount();
  editor.classList.add("show");
};
$("cancelBtn").onclick = () => editor.classList.remove("show");
$("saveBtn").onclick = () => {
  draft[editing] = linesEl.value;
  data = draft.map(text => {
    const lines = text.replace(/\s+$/, "").split(/\r?\n/).map(s => s.trim());
    return text.trim() ? lines.slice(0, MAX) : [];
  });
  if (!save()) {
    alert("Could not save on this device. Check that private browsing is off.");
    return;
  }
  editor.classList.remove("show");
  errEl.textContent = "";
};
</script>
</body>
</html>
