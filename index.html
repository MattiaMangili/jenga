<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jenga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jenga</title>
<style>
  :root {
    --bg: #111418;
    --card: #1e232a;
    --border: #3a424d;
    --text: #f2f4f7;
    --muted: #8a94a3;
    --accent: #b00020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Impact, sans-serif; letter-spacing: 0.02em;
  }
  button { font-family: inherit; }

  /* ---------- Home ---------- */
  #home {
    max-width: 480px; margin: 0 auto;
    height: 100%; display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    gap: 20px;
  }
  #modes { display: flex; gap: 10px; }
  .mode {
    opacity: 0.4;
    flex: 1; padding: 6px 0; font-size: 1rem; font-weight: 400;
    background: var(--card); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 6px;
  }
  .mode.active { opacity: 1; background: #2a1015; border-color: var(--accent); }
  #center {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 18px;
  }
  #num {
    font-family: inherit;
    width: 100%; max-width: 220px; padding: 28px 10px;
    font-size: 2.4rem; text-align: center;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 6px; outline: none;
  }
  #num:focus { border-color: var(--accent); }
  #go {
    width: 100%; max-width: 220px; padding: 18px 0;
    font-size: 1.6rem; letter-spacing: 0.08em;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
  }
  #err { min-height: 1.2em; color: #ff7a7a; font-size: 1rem; text-align: center; }
  /* Hidden menu: three faint dots in the bottom-right corner */
  #dots {
    position: fixed; right: calc(6px + env(safe-area-inset-right));
    bottom: calc(6px + env(safe-area-inset-bottom));
    padding: 12px 16px; font-size: 1.6rem; line-height: 1;
    background: transparent; color: #3a424d; border: none;
  }

  /* ---------- Code lock ---------- */
  #lock {
    position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.85);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #lock.show { display: flex; }
  #lockBox {
    width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 12px;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 6px; padding: 20px;
  }
  #lockTitle { text-align: center; font-size: 1.1rem; }
  #lockInput {
    width: 100%; padding: 14px 10px; font-size: 1.6rem; text-align: center; letter-spacing: 0.3em;
    font-family: inherit; background: var(--bg); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 6px; outline: none;
  }
  #lockInput:focus { border-color: var(--accent); }
  #lockMsg { min-height: 1.2em; text-align: center; color: #ff7a7a; font-size: .9rem; }
  #lockBar { display: flex; gap: 10px; }
  #lockCancel, #lockOk {
    flex: 1; padding: 12px 0; font-size: 1rem; border-radius: 6px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
  }
  #lockOk { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- Full-screen phrase ---------- */
  #overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: none; align-items: center; justify-content: center;
    padding: 80px 24px 24px; z-index: 10;
  }
  #overlay.show { display: flex; }
  #phrase {
    font-size: clamp(2rem, 9vw, 4.5rem); font-weight: 700;
    text-align: center; line-height: 1.2; word-break: break-word;
  }
  #close {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    width: 52px; height: 52px; font-size: 1.8rem; line-height: 1;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 6px;
  }
  #tag {
    position: absolute; top: calc(26px + env(safe-area-inset-top)); left: 20px;
    font-size: 1rem; opacity: .6;
  }

  /* ---------- Edit screen ---------- */
  #editor {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    display: none; flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    gap: 12px;
  }
  #editor.show { display: flex; }
  #editor h2 { margin: 0; font-size: 1.2rem; }
  #editHelp { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.35; }
  #editTabs { display: flex; gap: 10px; }
  .etab {
    flex: 1; padding: 12px 0; font-size: 1.1rem; font-weight: 600;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 6px;
  }
  .etab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #lines {
    flex: 1; width: 100%; padding: 14px; font-size: 1.05rem; line-height: 1.5;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 6px; outline: none; resize: none;
  }
  #lines:focus { border-color: var(--accent); }
  #count { color: var(--muted); font-size: .95rem; }
  #editBar { display: flex; gap: 10px; }
  #saveBtn {
    flex: 2; padding: 16px 0; font-size: 1.2rem; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
  }
  #cancelBtn {
    flex: 1; padding: 16px 0; font-size: 1.1rem;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border); border-radius: 6px;
  }
</style>
</head>
<body>

<div id="home">
  <div id="modes"></div>
  <div id="center">
    <input id="num" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
    <button id="go">GO</button>
    <div id="err"></div>
  </div>
  <button id="dots" aria-label="Menu">•••</button>
</div>

<div id="lock">
  <div id="lockBox">
    <div id="lockTitle"></div>
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <div id="lockMsg"></div>
    <div id="lockBar">
      <button id="lockCancel">Cancel</button>
      <button id="lockOk">OK</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="tag"></div>
  <button id="close" aria-label="Close">✕</button>
  <div id="phrase"></div>
</div>

<div id="editor">
  <h2>Edit phrases</h2>
  <p id="editHelp">One phrase per line. Line 1 = number 1, line 2 = number 2, and so on. Leave a line empty to skip a number.</p>
  <div id="editTabs"></div>
  <textarea id="lines" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  <div id="count"></div>
  <div id="editBar">
    <button id="cancelBtn">Cancel</button>
    <button id="saveBtn">Save</button>
  </div>
</div>

<script>
/* Mode names. Change these if you like (keep the list short enough to fit on one row). */
const MODE_NAMES = ["🌶️", "🌶️🌶️", "🌶️🌶️🌶️"];
const MAX = 54;
const KEY = "phrases-v1";

/* ---------- storage (only on this device) ---------- */
let data = MODE_NAMES.map(() => []);
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        data = MODE_NAMES.map((_, i) => Array.isArray(parsed[i]) ? parsed[i] : []);
      }
    }
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}
load();

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const modesEl = $("modes"), numEl = $("num"), errEl = $("err");
const overlay = $("overlay"), phraseEl = $("phrase"), tagEl = $("tag");
const editor = $("editor"), editTabs = $("editTabs"), linesEl = $("lines"), countEl = $("count");

let current = 0;

/* ---------- home ---------- */
MODE_NAMES.forEach((name, i) => {
  const b = document.createElement("button");
  b.className = "mode" + (i === 0 ? " active" : "");
  b.textContent = name;
  b.onclick = () => {
    current = i;
    [...modesEl.children].forEach((c, j) => c.classList.toggle("active", j === i));
    errEl.textContent = "";
  };
  modesEl.appendChild(b);
});

function go() {
  const n = parseInt(numEl.value, 10);
  if (!n || n < 1 || n > MAX) {
    errEl.textContent = "Enter a number from 1 to " + MAX;
    return;
  }
  const list = data[current];
  if (!list.length) {
    errEl.textContent = "No phrases in " + MODE_NAMES[current] + " yet.";
    return;
  }
  const text = (list[n - 1] || "").trim();
  if (!text) {
    errEl.textContent = "Nothing saved for " + n + " in " + MODE_NAMES[current];
    return;
  }
  errEl.textContent = "";
  numEl.blur();
  tagEl.textContent = MODE_NAMES[current] + " · " + n;
  phraseEl.textContent = text;
  overlay.classList.add("show");
}
function closeOverlay() {
  overlay.classList.remove("show");
  numEl.value = "";
}
$("go").onclick = go;
$("close").onclick = closeOverlay;
numEl.addEventListener("input", () => { numEl.value = numEl.value.replace(/\D/g, ""); });
numEl.addEventListener("keydown", e => { if (e.key === "Enter") go(); });

/* ---------- editor ---------- */
let draft = [];      // working copy: one string (all lines) per mode
let editing = 0;

function updateCount() {
  const lines = linesEl.value.replace(/\s+$/, "").split(/\r?\n/);
  const n = linesEl.value.trim() ? lines.length : 0;
  countEl.textContent = n + " line" + (n === 1 ? "" : "s") +
    (n > MAX ? " (only the first " + MAX + " are used)" : "");
}
function showTab(i) {
  draft[editing] = linesEl.value;
  editing = i;
  linesEl.value = draft[i];
  [...editTabs.children].forEach((c, j) => c.classList.toggle("active", j === i));
  updateCount();
}
MODE_NAMES.forEach((name, i) => {
  const b = document.createElement("button");
  b.className = "etab";
  b.textContent = name;
  b.onclick = () => showTab(i);
  editTabs.appendChild(b);
});
linesEl.addEventListener("input", updateCount);

function openEditor() {
  draft = data.map(list => list.join("\n"));
  editing = current;
  linesEl.value = draft[editing];
  [...editTabs.children].forEach((c, j) => c.classList.toggle("active", j === editing));
  updateCount();
  editor.classList.add("show");
}

/* ---------- code lock ----------
   The code is not written in plain text here, only its fingerprint (hash). */
const CODE_HASHES = ["59492ad92dbcb5f34317779b9051ae46a1a067aa9d55561c4f927a69604d809f", "x24290959"];
const lockEl = $("lock"), lockTitle = $("lockTitle"), lockInput = $("lockInput"), lockMsg = $("lockMsg");

async function hashCode(s) {
  const text = "jenga-salt:" + s;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 0;
    for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0;
    return "x" + h;
  }
}
function openLock() {
  lockTitle.textContent = "Enter code";
  lockInput.value = "";
  lockMsg.textContent = "";
  lockEl.classList.add("show");
  setTimeout(() => lockInput.focus(), 50);
}
function closeLock() {
  lockEl.classList.remove("show");
  lockInput.blur();
  lockInput.value = "";
}
async function submitLock() {
  if (CODE_HASHES.includes(await hashCode(lockInput.value))) {
    closeLock();
    openEditor();
  } else {
    lockMsg.textContent = "Wrong code";
    lockInput.value = "";
  }
}
$("dots").onclick = openLock;
$("lockCancel").onclick = closeLock;
$("lockOk").onclick = submitLock;
lockInput.addEventListener("input", () => { lockInput.value = lockInput.value.replace(/\D/g, ""); });
lockInput.addEventListener("keydown", e => { if (e.key === "Enter") submitLock(); });
$("cancelBtn").onclick = () => editor.classList.remove("show");
$("saveBtn").onclick = () => {
  draft[editing] = linesEl.value;
  data = draft.map(text => {
    const lines = text.replace(/\s+$/, "").split(/\r?\n/).map(s => s.trim());
    return text.trim() ? lines.slice(0, MAX) : [];
  });
  if (!save()) {
    alert("Could not save on this device. Check that private browsing is off.");
    return;
  }
  editor.classList.remove("show");
  errEl.textContent = "";
};
</script>
</body>
</html>
